<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Доска объявлений</title>
<style>
  :root{
    --text:#37352f; --text-2:#787774; --text-3:#9b9a97;
    --bg:#ffffff; --gray:#f7f6f3; --gray-2:#f1f1ef;
    --border:#e9e9e7; --border-strong:#d3d1cb;
    --blue:#2383e2; --blue-dark:#1b6ec2;
    --green:#dbeddb; --red:#ffe2dd;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";
    font-size:16px; line-height:1.5;
  }
  .page{max-width:1000px;margin:0 auto;padding:64px 48px 96px}
  @media(max-width:640px){.page{padding:32px 20px 64px}}
  .page-icon{font-size:60px;line-height:1;margin-bottom:14px}
  h1{margin:0 0 24px;font-size:40px;font-weight:700;letter-spacing:-.02em}
  h2{margin:0;font-size:20px;font-weight:600}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .count{color:var(--text-3);font-size:14px;font-weight:400;margin-left:6px}
  .form-card{border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:44px}
  .form-grid{display:grid;grid-template-columns:1fr 220px;gap:12px}
  .span-2{grid-column:1/-1}
  @media(max-width:640px){.form-grid{grid-template-columns:1fr}}
  label{display:block;margin-bottom:4px;font-size:12.5px;font-weight:600;color:var(--text-2)}
  input[type=text],input[type=number],textarea{
    width:100%;padding:6px 9px;font:inherit;font-size:14px;color:var(--text);
    background:#fff;border:1px solid var(--border);border-radius:3px;
    transition:border-color .12s, box-shadow .12s;
  }
  ::placeholder{color:var(--text-3)}
  input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(35,131,226,.12)}
  textarea{min-height:76px;resize:vertical}
  input[type=file]{font-size:13px;color:var(--text-2);width:100%}
  .actions{display:flex;justify-content:flex-end;margin-top:14px}
  .btn{font:inherit;font-size:14px;font-weight:500;padding:6px 16px;border-radius:4px;cursor:pointer;transition:background .12s}
  .btn-primary{background:var(--blue);border:1px solid var(--blue);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--blue-dark);border-color:var(--blue-dark)}
  .btn-secondary{background:#fff;border:1px solid var(--border-strong);color:var(--text)}
  .btn-secondary:hover:not(:disabled){background:var(--gray-2)}
  .btn:disabled{opacity:.55;cursor:default}
  .status{display:flex;gap:8px;align-items:flex-start;border-radius:4px;padding:10px 12px;font-size:14px;margin:0 0 14px}
  .status.ok{background:var(--green)} .status.err{background:var(--red)} .status.info{background:var(--gray-2)}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .card{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:4px;background:#fff;overflow:hidden;transition:box-shadow .15s}
  .card:hover{box-shadow:0 1px 4px rgba(55,53,47,.10),0 6px 16px rgba(55,53,47,.08)}
  .cover{aspect-ratio:16/10;background:var(--gray);display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .card-body{display:flex;flex-direction:column;gap:4px;flex:1;padding:10px 12px 12px}
  .card-title{margin:0;font-size:14.5px;font-weight:600}
  .card-desc{margin:0;font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tag{align-self:flex-start;margin-top:auto;background:var(--gray-2);border-radius:3px;padding:1px 7px;font-size:12.5px;font-weight:600;color:var(--text)}
  .empty{padding:28px;text-align:center;color:var(--text-3);font-size:14.5px;border:1px dashed var(--border-strong);border-radius:4px}
</style>
</head>
<body>
<div class="page">
  <div class="page-icon">📌</div>
  <h1>Доска объявлений</h1>

  <section>
    <div class="section-head"><h2>Новое объявление</h2></div>
    <div class="form-card">
      <div id="formStatus"></div>
      <form id="adForm">
        <div class="form-grid">
          <div>
            <label for="title">Название</label>
            <input type="text" id="title" required maxlength="100" placeholder="Например: велосипед Trek Marlin 7">
          </div>
          <div>
            <label for="price">Цена, ₽</label>
            <input type="number" id="price" required min="0" step="0.01" placeholder="0">
          </div>
          <div class="span-2">
            <label for="description">Описание</label>
            <textarea id="description" required maxlength="1000" placeholder="Состояние, комплектация, причина продажи…"></textarea>
          </div>
          <div class="span-2">
            <label for="image">Фотография (необязательно)</label>
            <input type="file" id="image" accept="image/*">
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Опубликовать</button>
        </div>
      </form>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>Объявления<span class="count" id="adsCount"></span></h2>
      <button class="btn btn-secondary" id="refreshBtn">↻ Обновить</button>
    </div>
    <div id="adsStatus"></div>
    <div class="gallery" id="adsContainer"></div>
  </section>
</div>

<script>
  const API_BASE = "https://inai-col1.fishrungames.com";
  const ADS_URL  = API_BASE + "/ads";

  const form         = document.getElementById("adForm");
  const submitBtn    = document.getElementById("submitBtn");
  const refreshBtn   = document.getElementById("refreshBtn");
  const adsContainer = document.getElementById("adsContainer");
  const adsCount     = document.getElementById("adsCount");
  const formStatus   = document.getElementById("formStatus");
  const adsStatus    = document.getElementById("adsStatus");

  const EMOJI_RULES = [
    [/ноут|macbook|комп|пк|pc/i, "💻"],
    [/iphone|телефон|смарт|phone/i, "📱"],
    [/велос|bike|trek/i, "🚲"],
    [/наушник|headphones|wh-1000/i, "🎧"],
    [/камер|фото|camera|alpha/i, "📷"],
    [/книг|book/i, "📚"],
    [/часы|watch|casio/i, "⌚"],
    [/кресл|стул|chair/i, "🪑"],
    [/диван|квартир|sofa/i, "🛋️"],
    [/кроссов|обув|nike/i, "👟"]
  ];
  function emojiFor(title){
    const s = title || "";
    for (const [re, e] of EMOJI_RULES) if (re.test(s)) return e;
    return "📦";
  }
  function imageUrl(u){
    if (!u) return null;
    return /^https?:/i.test(u) ? u : API_BASE + u;
  }
  function formatPrice(p){
    const n = Number(p) || 0;
    return new Intl.NumberFormat("ru-RU", { maximumFractionDigits: n % 1 ? 2 : 0 }).format(n) + " ₽";
  }
  function setStatus(el, type, msg){
    el.innerHTML = "";
    const d = document.createElement("div");
    d.className = "status " + type;
    d.textContent = msg;
    el.appendChild(d);
  }
  function clearStatus(el){ el.innerHTML = ""; }

  // GET /ads
  async function loadAds(){
    setStatus(adsStatus, "info", "Загружаем объявления…");
    adsContainer.innerHTML = "";
    adsCount.textContent = "";
    try {
      const res = await fetch(ADS_URL, { method: "GET", headers: { "Accept": "application/json" } });
      if (!res.ok) throw new Error("HTTP " + res.status + " " + res.statusText);
      const data = await res.json();
      clearStatus(adsStatus);

      const items = data.items || [];
      if (data.total != null) adsCount.textContent = "· " + data.total;
      if (items.length === 0){
        adsContainer.innerHTML = '<div class="empty">Объявлений пока нет — опубликуйте первое.</div>';
        return;
      }

      for (const ad of items){
        const card = document.createElement("article");
        card.className = "card";

        const cover = document.createElement("div");
        cover.className = "cover";
        const url = imageUrl(ad.image_url);
        if (url){
          const img = new Image();
          img.src = url; img.alt = ""; img.loading = "lazy";
          img.onerror = () => { cover.textContent = emojiFor(ad.title); };
          cover.appendChild(img);
        } else {
          cover.textContent = emojiFor(ad.title);
        }

        const body = document.createElement("div");
        body.className = "card-body";
        const t = document.createElement("h3"); t.className = "card-title"; t.textContent = ad.title || "Без названия";
        const d = document.createElement("p");  d.className = "card-desc";  d.textContent = ad.description || "";
        const p = document.createElement("span"); p.className = "tag"; p.textContent = formatPrice(ad.price);
        body.append(t, d, p);

        card.append(cover, body);
        adsContainer.appendChild(card);
      }
    } catch (err){
      setStatus(adsStatus, "err", "Не удалось загрузить список: " + err.message);
    }
  }

  // POST /ads (multipart/form-data)
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "Публикуем…";
    clearStatus(formStatus);
    try {
      const fd = new FormData();
      fd.append("title", document.getElementById("title").value.trim());
      fd.append("description", document.getElementById("description").value.trim());
      fd.append("price", document.getElementById("price").value);
      const file = document.getElementById("image").files[0];
      if (file) fd.append("image", file);

      const res = await fetch(ADS_URL, { method: "POST", body: fd });
      if (!res.ok) throw new Error("HTTP " + res.status + " " + (await res.text() || res.statusText));
      const created = await res.json();

      setStatus(formStatus, "ok", "Объявление №" + created.id + " опубликовано.");
      form.reset();
      await loadAds();
      setTimeout(() => clearStatus(formStatus), 4000);
    } catch (err){
      setStatus(formStatus, "err", "Не удалось опубликовать: " + err.message);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Опубликовать";
    }
  });

  refreshBtn.addEventListener("click", loadAds);
  loadAds();
</script>
</body>
</html>
